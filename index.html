</style></head><body><header><div class="top"><div><h1>Tube Pulse <span style="font-size:19px">🚇</span></h1><div class="sub">Your London Underground companion · v4</div></div><div class="roundel"><span>TUBE</span></div></div><label class="search"><span>⌕</span><input id="search" placeholder="Search major London stations…" autocomplete="off" aria-label="Search stations"></label></header><main id="app"></main><nav><button data-tab="stations" class="active">⌕ Stations</button><button data-tab="map">♧ Map</button><button data-tab="lines">≋ Lines</button><button data-tab="saved">☆ Saved</button><button data-tab="about">ⓘ About</button></nav><script>
const L={bakerloo:['Bakerloo','#B36305'],central:['Central','#E32017'],circle:['Circle','#F3B61F'],district:['District','#00782A'],hammersmith:['Hammersmith & City','#F3A9BB'],jubilee:['Jubilee','#7C878E'],metropolitan:['Metropolitan','#9B0056'],northern:['Northern','#333333'],piccadilly:['Piccadilly','#003688'],victoria:['Victoria','#0098D4'],waterloo:['Waterloo & City','#76D0BD'],elizabeth:['Elizabeth','#6950A1'],dlr:['DLR','#00A4A7'],overground:['London Overground','#EE7C0E']};

['Waterloo','940GZZLUWLO',['bakerloo','jubilee','northern','waterloo'],'Major rail terminus, South Bank, London Eye and Waterloo East connections.','Rail interchange, step-free routes vary by line.'],
['King’s Cross St Pancras','940GZZLUKSX',['circle','hammersmith','metropolitan','northern','piccadilly','victoria'],'St Pancras International, Eurostar terminal, King’s Cross railway station and Granary Square.','Extensive interchanges; allow extra time to change lines.'],
['Oxford Circus','940GZZLUOXC',['bakerloo','central','victoria'],'Oxford Street shopping and Regent Street.','Very busy at shopping and commuting peaks.'],
['Victoria','940GZZLUVIC',['circle','district','victoria'],'Victoria railway station, coach station, Buckingham Palace area.','Busy interchanges and National Rail connections.'],
['Liverpool Street','940GZZLULVT',['central','circle','hammersmith','metropolitan','elizabeth'],'Liverpool Street railway terminus, Broadgate and Spitalfields.','Major commuter interchange.'],

['Paddington','940GZZLUPAC',['bakerloo','circle','district','hammersmith','elizabeth'],'Paddington station, Heathrow connections via rail and Paddington Basin.','Multiple separate platforms and Underground access points.'],
['Green Park','940GZZLUGPK',['jubilee','piccadilly','victoria'],'Green Park, Buckingham Palace and Piccadilly.','Interchange walking distances can be significant.'],

['Stratford','940GZZLUSTD',['central','jubilee','elizabeth','dlr','overground'],'Queen Elizabeth Olympic Park, Westfield Stratford and National Rail.','Large multimodal interchange.'],

let tab='stations', selected=null, lineFilter='all', search='', lineStatuses=[], arrivals=[], arrivalState='idle', loadedAt=null, crowdActual=null;let saved=new Set(JSON.parse(localStorage.getItem('tubepulse-favs')||'[]'));
const esc=x=>String(x).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const badges=ids=>ids.map(id=>`<span class="line" style="background:${L[id]?.[1]||'#4b698b'};color:${['circle','hammersmith','waterloo'].includes(id)?'#16243e':'white'}">${esc(L[id]?.[0]||id)}</span>`).join('');
function current(){return S.find(x=>x[1]===selected)}
function showTab(t){selected=null;v3Platform='all';tab=t;render()}
function stationCard(s){return `<article class="card station" data-id="${s[1]}" role="button" tabindex="0"><div><h3>${esc(s[0])}</h3><div class="lines">${badges(s[2])}</div></div><span class="arrow">›</span></article>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let el=document.getElementById('app');if(selected){renderDetail(el);wire();return}if(tab==='stations'||tab==='saved'){let list=S.filter(s=>(tab!=='saved'||saved.has(s[1]))&&(lineFilter==='all'||s[2].includes(lineFilter))&&s[0].toLowerCase().includes(search.toLowerCase()));el.innerHTML=`<div class="section-title"><h2>${tab==='saved'?'Your saved stations':'Major stations'}</h2><span class="pill">${list.length} stations</span></div>${tab==='stations'?`<div class="tabs"><button class="${lineFilter==='all'?'active':''}" data-filter="all">All lines</button>${Object.keys(L).filter(k=>k!=='overground').map(k=>`<button data-filter="${k}" class="${lineFilter===k?'active':''}">${L[k][0]}</button>`).join('')}</div>`:''}${list.map(stationCard).join('')||'<p class="empty">No matching stations. Try another search or save a station.</p>'}<footer>Station information is a curated guide, not live accessibility advice. Data © Transport for London.</footer>`}else if(tab==='lines'){el.innerHTML=`<div class="section-title"><h2>Live network status</h2><button class="linkbutton" id="refreshLines">↻ Refresh</button></div><div class="card"><p class="notice">Statuses are fetched from Transport for London when available. They are never invented.</p></div><div id="linelist">${lineMarkup()}</div><footer>Information supplied by Transport for London</footer>`;if(!lineStatuses.length)fetchLines()}else{el.innerHTML=`<div class="card"><h2>About Tube Pulse</h2><p>An installable, independent personal London Tube guide, with station highlights and TfL live train predictions.</p><h3>What the labels mean</h3><p><b>Live arrival:</b> Timings requested from TfL's Unified API.</p><p><b>Typical crowding:</b> A rough planning heuristic based on time of day, NOT real-time carriage occupancy or TfL historic measurements. We show a generic curve only to help explore times.</p><p><b>Station queue:</b> Actual platform and entrance wait times are not published in this app. The time to the next train is not necessarily how long it will take you to reach the train.</p><p>Tap a station to explore services and nearby highlights. More city networks can be added in future.</p><p class="notice">Not affiliated with or endorsed by Transport for London. Train arrivals may be missing or inaccurate during disruptions. Always follow official announcements and station signage.</p></div>`}wire()}
function lineMarkup(){if(!lineStatuses.length)return '<p class="empty">Fetching line statuses…</p>';return lineStatuses.map(x=>{let c=x.lineStatuses?.[0],good=c?.statusSeverity===10;return `<article class="card ${good?'status':'status warning'}"><div class="row"><b><span class="dot" style="background:${L[x.id]?.[1]||'#777'}"></span>${esc(x.name)}</b><span class="pill">${esc(c?.statusSeverityDescription||'Unknown')}</span></div>${c?.reason?`<p class="small muted">${esc(c.reason)}</p>`:''}</article>`}).join('')}
function crowdLevel(hour,weekday){let v=weekday?([7,8,9,17,18].includes(hour)?3:[6,10,16,19].includes(hour)?2:hour>=11&&hour<=15?1:0):([12,13,14,15,16,17].includes(hour)?2:hour>=9&&hour<=20?1:0);return v}
function renderDetail(el){let s=current(),now=new Date(),hour=now.getHours();const est=crowdLevel(hour,(now.getDay()+6)%7<5);const tags=['Quieter','Moderate','Busy','Very busy'];let chart=Array.from({length:19},(_,i)=>{let h=i+5,v=crowdLevel(h,true),height=9+(v+1)*9;return `<div class="bar ${h===hour?'on':v===3?'high':v===2?'peak':''}" style="height:${height}px" title="${h}:00: ${tags[v]}"></div>`}).join('');el.innerHTML=`<div class="detailHeader"><button class="back" id="back">‹ Stations</button><button class="back" id="favorite">${saved.has(s[1])?'★ Saved':'☆ Save'}</button></div><div class="section-title" style="margin-top:12px"><div><h2 style="font-size:23px;margin:0 0 10px">${esc(s[0])}</h2><div class="lines">${badges(s[2])}</div></div></div><section class="card"><div class="toolbar"><h3 style="margin:0">Next trains</h3><button class="linkbutton" id="refreshArrivals">↻ Refresh</button></div><p class="notice">Live TfL predictions, not a station entrance queue estimate.</p><div id="arrivals">${arrivalMarkup()}</div><p class="small muted">${loadedAt?'Updated '+loadedAt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'Updates on request'}</p></section><section class="card"><div class="row"><div><h3 style="margin:0 0 5px">Typical crowding by hour</h3><span class="small muted">Illustrative weekday pattern • not measured</span></div><span class="pill">${tags[est]} now*</span></div><div class="crowdrow" style="margin-top:14px">${chart}</div><div class="timeLabels"><span>05:00</span><span>09:00</span><span>13:00</span><span>17:00</span><span>23:00</span></div><p class="notice">*Generic time-of-day guide, NOT a station-specific observation, prediction of the arriving train’s load, or live passenger data. Weekends can differ. No actual platform wait-time sensor is connected.</p></section><section class="card"><h3 style="margin:0 0 10px">Around the station</h3><p>${esc(s[3])}</p><div class="chips"><span class="chip">Local highlights</span><span class="chip">Interchange</span></div><p class="notice">${esc(s[4])}</p><a class="linkbutton" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s[0]+' London Underground Station')}">Open station in Maps ↗</a></section><footer>Live arrival data © Transport for London • Independent personal project</footer>`;if(arrivalState==='idle'||arrivals.length===0&&arrivalState!=='loading')fetchArrivals(s[1]);}
function arrivalMarkup(){if(arrivalState==='loading')return '<p class="empty">Loading live arrival predictions…</p>';if(arrivalState==='error')return '<p class="empty">Live arrivals unavailable. Check internet connection or try refresh. No timetable substitutes have been invented.</p>';if(arrivalState==='empty')return '<p class="empty">No current arrival predictions returned for this station.</p>';return arrivals.slice(0,12).map(a=>`<div class="train"><div class="row"><div><div style="font-weight:800">${esc(a.lineName||'Tube')} → ${esc(a.destinationName||a.towards||'Destination not supplied')}</div><div class="small muted">${esc(a.platformName||'Platform unlisted')} ${a.currentLocation?'· '+esc(a.currentLocation):''}</div></div><div class="eta">${a.timeToStation<=45?'Due':Math.max(1,Math.ceil(a.timeToStation/60))+' min'}</div></div></div>`).join('')}
